<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Choose on map · RideBot HK</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff); --text: var(--tg-theme-text-color, #16181d);
    --hint: var(--tg-theme-hint-color, #6b7280); --field: var(--tg-theme-secondary-bg-color, #f2f2f5);
    --accent: var(--tg-theme-button-color, #c8102e); --accent-text: var(--tg-theme-button-text-color, #fff);
    --red: #c8102e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang HK", "Noto Sans HK", "Noto Color Emoji", sans-serif; }
  #map { position: fixed; top: 0; right: 0; bottom: 0; left: 0; }
  .top { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; padding: 10px 12px 0; }
  .search { display: flex; align-items: center; gap: 8px; background: var(--bg); border-radius: 12px; padding: 0 12px;
    box-shadow: 0 2px 10px rgba(0,0,0,.18); }
  .search input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: var(--text);
    font: inherit; padding: 12px 0; }
  .search .clear { border: 0; background: none; color: var(--hint); font-size: 18px; cursor: pointer; display: none; }
  .search.has-text .clear { display: block; }
  ul.suggest { list-style: none; margin: 6px 0 0; padding: 0; background: var(--bg); border-radius: 12px;
    box-shadow: 0 6px 20px rgba(0,0,0,.18); overflow: hidden; max-height: 32vh; overflow-y: auto; }  /* the pin, mid-map, stays in view */
  ul.suggest:empty { display: none; }
  ul.suggest li { padding: 10px 14px; border-top: 1px solid var(--field); cursor: pointer; }
  ul.suggest li:first-child { border-top: 0; }
  ul.suggest li.on { background: var(--field); }  /* the result the pin is on now */
  /* One at a time: the search results, or the card with Confirm below (they'd overlap on a phone) */
  body.searching .card, body.searching .locate { display: none; }
  ul.suggest .m { display: block; } ul.suggest .s { display: block; font-size: 13px; color: var(--hint); }
  /* the pin stays in the middle; the map moves underneath it */
  .pin { position: fixed; left: 50%; top: 50%; z-index: 900; width: 40px; height: 52px; margin: -52px 0 0 -20px;
    pointer-events: none; transition: transform .15s ease; }
  .pin.lift { transform: translateY(-10px); }
  .pin svg { width: 100%; height: 100%; filter: drop-shadow(0 3px 3px rgba(0,0,0,.3)); }
  .shadow { position: fixed; left: 50%; top: 50%; z-index: 890; width: 14px; height: 6px; margin: -3px 0 0 -7px;
    border-radius: 50%; background: rgba(0,0,0,.25); pointer-events: none; }
  .locate { position: fixed; right: 12px; bottom: 200px; z-index: 1000; width: 44px; height: 44px; border-radius: 50%;
    border: 0; background: var(--bg); box-shadow: 0 2px 10px rgba(0,0,0,.2); font-size: 20px; cursor: pointer; }
  .card { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000; background: var(--bg); padding: 14px 16px 18px;
    border-radius: 16px 16px 0 0; box-shadow: 0 -2px 12px rgba(0,0,0,.15); }
  .card .label { font-size: 12px; color: var(--hint); margin-bottom: 2px; }
  .card .addr { font-weight: 600; min-height: 1.4em; }
  .card .sub { font-size: 13px; color: var(--hint); min-height: 1.2em; }
  .card .kerb { display: none; margin-top: 6px; color: #d93025; font-size: 14px; font-weight: 600; }
  .card .near { display: none; margin-top: 8px; border: 1px solid var(--accent); color: var(--accent); background: none;
    border-radius: 10px; padding: 8px 10px; font: 600 14px/1.3 inherit; text-align: left; width: 100%; cursor: pointer; }
  .card button.confirm { display: none; width: 100%; margin-top: 12px; border: 0; border-radius: 12px; padding: 14px;
    background: var(--accent); color: var(--accent-text); font: 600 16px/1 inherit; cursor: pointer; }
  .status { font-size: 13px; color: var(--hint); margin-top: 6px; min-height: 1em; }
  .leaflet-control-attribution { font-size: 10px; }
  .spot { width: 28px; height: 28px; border-radius: 50%; background: #fff; box-shadow: 0 1px 5px rgba(0,0,0,.35);
    display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .leaflet-bottom.leaflet-right { bottom: 175px; }
</style>
</head>
<body>
<div id="map"></div>
<div class="top">
  <div class="search" id="search">
    <span>🔎</span>
    <input id="q" autocomplete="off">
    <button class="clear" id="clear" type="button" aria-label="Clear">×</button>
  </div>
  <ul class="suggest" id="suggest"></ul>
</div>
<div class="shadow"></div>
<div class="pin" id="pin">
  <svg viewBox="0 0 40 52" aria-hidden="true"><path d="M20 0C9 0 0 9 0 20c0 14.5 20 32 20 32s20-17.5 20-32C40 9 31 0 20 0z" fill="#c8102e"/><circle cx="20" cy="20" r="7" fill="#fff"/></svg>
</div>
<button class="locate" id="locate" type="button" aria-label="My location">📍</button>
<div class="card">
  <div class="label" id="title"></div>
  <div class="addr" id="addr">…</div>
  <div class="sub" id="sub"></div>
  <div class="kerb" id="kerb"></div>
  <button class="near" id="near" type="button"></button>
  <div class="status" id="status"></div>
  <button class="confirm" id="confirm" type="button"></button>
</div>

<script>
(() => {
  "use strict";
  const tg = window.Telegram && Telegram.WebApp;
  // Opened from a bot menu button, Telegram gives no initData, but it always reports its platform.
  const inTelegram = !!(tg && tg.platform && tg.platform !== "unknown");
  const P = new URLSearchParams(location.search);
  const lang = ["en", "zh-Hant", "zh-Hans"].includes(P.get("lang")) ? P.get("lang") : "en";
  const mode = P.get("mode") || "dropoff";
  const TEXT = {
    en: { dropoff: "Destination", stop: "Stop on the way", pickup: "Pickup point", driver: "Your position", search: "Search a place or MTR station",
          confirm: "Confirm this spot", move: "Move the map to put the pin on the exact spot", finding: "Finding you…",
          noloc: "Couldn't get your location. Move the map or search instead.", none: "No matches",
          unnamed: "Pinned spot", preview: "Preview: open this from the bot to send it.",
          failed: "Couldn't send it. Check your connection and tap Confirm again.",
          rough: "Your phone only gave a rough location (up to {m} out). Turn on Precise Location for Telegram in your phone's settings, or move the pin yourself.",
          taxi: "Taxi stand", door: "Entrance", spotPickup: "Taxi pick-up point", spotDropoff: "Taxi drop-off point",
          star: "Recommended pickup point", spots: "tap ⭐ 🚕 🚖 🚪 to use that spot", use: "Use the nearby {what}: {name} ({m} m)",
          kerb: "🚫 Taxis can't stop here: {rule}" },
    "zh-Hant": { dropoff: "目的地", stop: "中途站", pickup: "上車點", driver: "你的位置", search: "搜尋地點或港鐵站", confirm: "確認此位置",
          move: "移動地圖，把圖釘放在準確位置", finding: "正在定位…", noloc: "未能取得你的位置，請移動地圖或搜尋。",
          none: "找不到相符地點", unnamed: "已標記的位置", preview: "預覽模式：請從機械人開啟以傳送。",
          failed: "未能傳送，請檢查網絡後再按確認。",
          rough: "手機只提供了大概位置（誤差可達 {m}）。請在手機設定開啟 Telegram 的「精確位置」，或自行移動圖釘。",
          taxi: "的士站", door: "入口", spotPickup: "的士上落客點", spotDropoff: "的士落客點", star: "建議上車點",
          spots: "可按 ⭐ 🚕 🚖 🚪 使用該位置", use: "使用附近的{what}：{name}（{m} 米）",
          kerb: "🚫 的士不能在此停車：{rule}" },
    "zh-Hans": { dropoff: "目的地", stop: "中途站", pickup: "上车点", driver: "你的位置", search: "搜索地点或港铁站", confirm: "确认此位置",
          move: "移动地图，把图钉放在准确位置", finding: "正在定位…", noloc: "未能取得你的位置，请移动地图或搜索。",
          none: "找不到相符地点", unnamed: "已标记的位置", preview: "预览模式：请从机器人打开以发送。",
          failed: "未能发送，请检查网络后再按确认。",
          rough: "手机只提供了大概位置（误差可达 {m}）。请在手机设置开启 Telegram 的「精确位置」，或自行移动图钉。",
          taxi: "的士站", door: "入口", spotPickup: "的士上落客点", spotDropoff: "的士落客点", star: "建议上车点",
          spots: "可按 ⭐ 🚕 🚖 🚪 使用该位置", use: "使用附近的{what}：{name}（{m} 米）",
          kerb: "🚫 的士不能在此停车：{rule}" },
  }[lang];
  const $ = id => document.getElementById(id);
  const HK = ["hong kong", "香港"];

  if (tg) { tg.ready(); tg.expand(); }
  document.documentElement.lang = lang;
  $("title").textContent = TEXT[mode] || TEXT.dropoff;
  $("q").placeholder = TEXT.search;
  $("confirm").textContent = TEXT.confirm;
  $("sub").textContent = TEXT.move;

  const lat0 = parseFloat(P.get("lat")) || 22.3193, lon0 = parseFloat(P.get("lon")) || 114.1694;
  const map = L.map("map", { zoomControl: false, attributionControl: true }).setView([lat0, lon0], P.get("lat") ? 18 : 17);  // street level
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(map);

  let label = "", seq = 0, timer, naming = Promise.resolve();
  let chosen = null;  // a place picked from search: its name stays while the pin is still on it
  // Opened with no spot and no location yet, the map is somewhere arbitrary (central Kowloon): nothing to confirm
  // until a real spot is chosen (a search result, the phone's location, a stand tapped, or the map moved by hand).
  let placed = !!P.get("lat");
  function setPlaced() {
    if (placed) return;
    placed = true;
    if (inTelegram) tg.MainButton.show(); else $("confirm").style.display = "block";
  }
  map.on("dragstart", setPlaced);
  const photonLang = lang === "en" ? "en" : "default";
  // The bot's own place search (government address + place data with OpenStreetMap); OpenStreetMap alone if it's down.
  const SEARCH = P.get("search") || "https://api.taxibothk.com/places/search";
  async function shared(q) {
    const url = new URL(SEARCH);
    url.searchParams.set("q", q); url.searchParams.set("lang", lang);
    const r = await fetch(url);
    if (!r.ok) throw new Error("search failed");
    return (await r.json()).results.map(x => ({ lat: x.lat, lon: x.lon, main: x.name, sub: x.details, names: x.names }));
  }
  async function osmSearch(q) {
    const feats = await photon("api/", { q, limit: 20, lat: 22.3193, lon: 114.1694, lang: photonLang });
    const seen = new Set();
    return feats.filter(f => {
      const p = f.properties, [lon, lat] = f.geometry.coordinates;
      const mentions = ["state", "city", "district"].some(k => HK.some(w => (p[k] || "").toLowerCase().includes(w)));
      return mentions || (lat > 22.15 && lat < 22.57 && lon > 113.82 && lon < 114.45);
    }).map(f => { const n = nameOf(f.properties), [lon, lat] = f.geometry.coordinates; return { lat, lon, ...n }; })
      .filter(x => !seen.has(x.main + "|" + x.sub) && seen.add(x.main + "|" + x.sub));
  }
  const metres = (a, b) => Math.hypot((a.lat - b.lat) * 111320, (a.lng - b.lon) * 111320 * Math.cos(a.lat * Math.PI / 180));
  async function photon(path, q) {
    const url = new URL("https://photon.komoot.io/" + path);
    Object.entries(q).forEach(([k, v]) => url.searchParams.set(k, v));
    const r = await fetch(url);
    return r.ok ? ((await r.json()).features || []) : [];
  }
  function nameOf(p) {
    const street = [p.street, p.housenumber].filter(Boolean).join(" ");
    const main = p.name || street || TEXT.unnamed;
    const sub = [p.name ? street : null, p.district, p.city].filter(Boolean)
      .filter(x => x !== main && !HK.some(w => x.toLowerCase().includes(w)));
    return { main, sub: [...new Set(sub)].join(", ") };
  }

  // Address under the pin, updated when the map stops moving.
  map.on("movestart", () => $("pin").classList.add("lift"));
  map.on("moveend", () => {
    $("pin").classList.remove("lift");
    clearTimeout(timer);
    const mine = ++seq, c = map.getCenter();
    if (!placed) {  // nothing chosen yet: say how to choose, don't name the arbitrary starting spot
      label = "";
      $("addr").textContent = "🔎 " + TEXT.search;
      $("sub").textContent = TEXT.move;
      return;
    }
    if (chosen && metres(c, chosen) < 30) {  // still on the place picked from search: keep its name
      label = chosen.sub ? `${chosen.main}, ${chosen.sub.replace(/ · /g, ", ")}` : chosen.main;
      $("addr").textContent = chosen.main;
      $("sub").textContent = chosen.sub || "";
      return;
    }
    chosen = null;
    label = "";
    let done;
    naming = new Promise(r => { done = r; });
    timer = setTimeout(async () => {
      try {
        const f = (await photon("reverse", { lat: c.lat, lon: c.lng, lang: photonLang }))[0];
        if (mine !== seq) return;
        const n = f ? nameOf(f.properties) : { main: TEXT.unnamed, sub: "" };
        label = n.sub ? `${n.main}, ${n.sub}` : n.main;
        $("addr").textContent = n.main;
        $("sub").textContent = n.sub || `${c.lat.toFixed(5)}, ${c.lng.toFixed(5)}`;
      } catch {
        label = "";
        $("addr").textContent = `${c.lat.toFixed(5)}, ${c.lng.toFixed(5)}`;
      } finally { done(); }
    }, 350);
  });
  map.fire("moveend");

  // Spots near the pin, from our server: ⭐ pickup points we placed, 🚕 official taxi stands and 🚖 taxi pick-up
  // points (Transport Department), 🚪 main entrances (OpenStreetMap). A building can have several doors: the rider
  // taps the one they'll wait at, and the nearest official one within 60 m is offered under the address.
  const SPOTS = SEARCH.replace(/\/search$/, "/spots");
  const ICON = { star: "⭐", taxi: "🚕", pickup: "🚖", dropoff: "🚖", entrance: "🚪" };
  const WHAT = { star: TEXT.star, taxi: TEXT.taxi, pickup: TEXT.spotPickup, dropoff: TEXT.spotDropoff, entrance: TEXT.door };
  const OFFER = ["star", "taxi", "pickup"].concat(mode === "pickup" ? [] : ["dropoff"]);
  const asked = new Set(), shown = new Map();
  let stimerSpots;
  const spotName = s => (lang === "en" && s.name_en) || s.name || s.name_en || "";
  const spotNote = s => (lang === "en" && s.note_en) || s.note || "";
  function useSpot(s) {
    setPlaced();
    const near = chosen ? chosen.main : $("addr").textContent;  // the building it belongs to
    const name = spotName(s), note = spotNote(s);
    chosen = { lat: s.lat, lon: s.lon, main: `${ICON[s.kind]} ${name || WHAT[s.kind]}`,
               sub: [name ? (note || WHAT[s.kind]) : "", !name && near && near !== "…" ? near : ""]
                 .filter(Boolean).join(" · ") };
    map.setView([s.lat, s.lon], Math.max(map.getZoom(), 18));
    map.fire("moveend");
  }
  function placeSpot(s) {
    const k = s.lat + "," + s.lon;
    if (shown.has(k) || shown.size > 400 || (s.kind === "dropoff" && mode === "pickup")) return;  // not for pickups
    shown.set(k, s);
    const icon = L.divIcon({ className: "", iconSize: [28, 28], iconAnchor: [14, 14],
                             html: `<div class="spot">${ICON[s.kind] || "📍"}</div>` });
    L.marker([s.lat, s.lon], { icon, keyboard: false, zIndexOffset: s.kind === "star" ? 500 : 0 }).addTo(map)
      .on("click", () => useSpot(s));
  }
  function offerNearest(within) {  // "Use the nearby taxi stand: Russell Street (40 m)"
    const c = map.getCenter();
    let best = null, bestM = within || 60;
    for (const s of shown.values()) {
      const m = metres(c, s);
      if (OFFER.includes(s.kind) && spotName(s) && m < bestM && m > 8) { best = s; bestM = m; }
    }
    $("near").style.display = best ? "block" : "none";
    if (best) {
      $("near").textContent = `${ICON[best.kind]} ` + TEXT.use.replace("{what}", WHAT[best.kind])
        .replace("{name}", spotName(best)).replace("{m}", Math.round(bestM));
      $("near").onclick = () => useSpot(best);
    }
  }
  if (mode !== "driver") map.on("moveend", () => {
    hints();
    clearTimeout(stimerSpots);
    if (map.getZoom() < 16) return;
    stimerSpots = setTimeout(async () => {
      const c = map.getCenter(), key = c.lat.toFixed(3) + "," + c.lng.toFixed(3);
      if (asked.has(key)) return;
      asked.add(key);
      try {
        const url = new URL(SPOTS);
        url.searchParams.set("lat", c.lat.toFixed(3)); url.searchParams.set("lon", c.lng.toFixed(3));
        const r = await fetch(url);
        const found = r.ok ? (await r.json()).spots || [] : [];
        found.forEach(placeSpot);
        if (found.length) $("title").textContent = `${TEXT[mode] || TEXT.dropoff} · ${TEXT.spots}`;
        hints();
      } catch { asked.delete(key); }  // try again next time the map stops here
    }, 500);
  });

  // Kerbs where taxis may not stop (Transport Department: no-stopping restrictions, bus lanes, pedestrian zones),
  // drawn as red lines when zoomed in. A pin on one that's in force now gets a warning and a wider offer of the
  // nearest taxi stand or pick-up point, unless an official stand or point (where taxis may stop) is right there.
  const KERBS = SEARCH.replace(/\/search$/, "/kerbs");
  const kerbLayer = L.layerGroup(), kerbAsked = new Set(), kerbLines = new Map();
  let ktimer;
  function toLine(c, pts) {  // metres from the map centre to a polyline
    const k = 111320 * Math.cos(c.lat * Math.PI / 180);
    const xy = pts.map(p => [(p[1] - c.lng) * k, (p[0] - c.lat) * 111320]);
    let best = Infinity;
    for (let i = 0; i < Math.max(1, xy.length - 1); i++) {
      const [ax, ay] = xy[i], [bx, by] = xy[i + 1] || xy[i], dx = bx - ax, dy = by - ay;
      const t = Math.max(0, Math.min(1, -(ax * dx + ay * dy) / ((dx * dx + dy * dy) || 1e-9)));
      best = Math.min(best, Math.hypot(ax + t * dx, ay + t * dy));
    }
    return best;
  }
  function kerbHere() {
    const c = map.getCenter();
    for (const s of shown.values()) {  // an official stand, pick-up point or ⭐ spot right here: taxis may stop
      if (["star", "taxi", "pickup"].concat(mode === "pickup" ? [] : ["dropoff"]).includes(s.kind) && metres(c, s) <= 20)
        return null;
    }
    let best = null, bestM = 10;
    for (const k of kerbLines.values()) {
      if (!k.active) continue;
      const m = toLine(c, k.pts);
      if (m <= bestM) { best = k; bestM = m; }
    }
    return best;
  }
  function hints() {
    const k = mode === "driver" ? null : kerbHere();
    $("kerb").style.display = k ? "block" : "none";
    if (k) $("kerb").textContent = TEXT.kerb.replace("{rule}", lang === "en" ? k.text_en : k.text);
    offerNearest(k ? 150 : 60);
  }
  map.on("zoomend", () => { map.getZoom() >= 17 ? kerbLayer.addTo(map) : kerbLayer.remove(); });
  if (mode !== "driver") map.on("moveend", () => {
    clearTimeout(ktimer);
    if (map.getZoom() < 16) return;
    ktimer = setTimeout(async () => {
      const c = map.getCenter(), key = c.lat.toFixed(3) + "," + c.lng.toFixed(3);
      if (kerbAsked.has(key)) return;
      kerbAsked.add(key);
      try {
        const url = new URL(KERBS);
        url.searchParams.set("lat", c.lat.toFixed(4)); url.searchParams.set("lon", c.lng.toFixed(4));
        url.searchParams.set("mode", mode);
        const r = await fetch(url);
        for (const k of (r.ok ? (await r.json()).lines || [] : [])) {
          const id = k.pts[0].join() + k.text;
          if (kerbLines.has(id) || kerbLines.size > 2000) continue;
          kerbLines.set(id, k);
          L.polyline(k.pts, { color: k.active ? "#d93025" : "#999", weight: 4, opacity: k.active ? .7 : .5,
                              dashArray: k.active ? null : "4 6", interactive: false }).addTo(kerbLayer);
        }
        if (map.getZoom() >= 17) kerbLayer.addTo(map);
        hints();
      } catch { kerbAsked.delete(key); }
    }, 600);
  });

  // Search box: the pin jumps to the first result as soon as there are results (the list stays open to pick
  // another); Enter takes the one the pin is on.
  let sseq = 0, stimer;
  function goTo(n, done) {
    setPlaced();
    chosen = n;
    map.setView([n.lat, n.lon], 18, { animate: false });
    map.fire("moveend");  // name it now, even if the map didn't need to move
    if (done) { $("suggest").innerHTML = ""; $("q").blur(); }
  }
  $("q").addEventListener("input", () => {
    const q = $("q").value.trim();
    $("search").classList.toggle("has-text", !!q);
    clearTimeout(stimer);
    if (q.length < 2) { $("suggest").innerHTML = ""; return; }
    stimer = setTimeout(async () => {
      const mine = ++sseq;
      let found = await shared(q).catch(() => osmSearch(q)).catch(() => []);
      if (mine !== sseq) return;
      found = found.slice(0, 6);
      $("suggest").innerHTML = "";
      if (!found.length) { $("status").textContent = TEXT.none; return; }
      $("status").textContent = "";
      found.forEach((n, i) => {
        const li = document.createElement("li");
        const m = document.createElement("span"); m.className = "m"; m.textContent = n.main;
        const s = document.createElement("span"); s.className = "s"; s.textContent = n.sub;
        li.append(m, s);
        if (i === 0) li.className = "on";
        li.addEventListener("click", () => goTo(n, true));
        $("suggest").append(li);
      });
      goTo(found[0], false);  // the pin on the first result straight away
    }, 400);
  });
  // While there are results to pick from, they take the screen and the card below hides; touching the map closes them.
  new MutationObserver(() => document.body.classList.toggle("searching", $("suggest").children.length > 0))
    .observe($("suggest"), { childList: true });
  map.on("mousedown touchstart dragstart", () => { if ($("suggest").children.length) { $("suggest").innerHTML = ""; $("q").blur(); } });
  $("q").addEventListener("keydown", ev => {
    if (ev.key !== "Enter") return;
    ev.preventDefault();
    if (chosen && $("suggest").children.length) goTo(chosen, true);
  });
  $("clear").addEventListener("click", () => {
    $("q").value = ""; $("suggest").innerHTML = ""; $("search").classList.remove("has-text"); $("q").focus();
  });

  // Telegram's init() does nothing (and never calls back) once it has been done: only call it the first time.
  function withLocationManager(lm, then) { lm.isInited ? then() : lm.init(then); }

  // My location: Telegram's location access if available, else the browser's. A phone may give only a rough
  // position ("Precise Location" off, or no GPS fix yet) that can be kilometres out: show how far out it may be
  // as a circle, say so, and keep taking better fixes for a few seconds, until the user moves the map.
  let ring = null, watch = null, best = Infinity;
  const ROUGH_M = 150;
  const stopWatch = () => { if (watch !== null) navigator.geolocation.clearWatch(watch); watch = null; };
  map.on("dragstart", () => { stopWatch(); best = 0; });  // they're placing the pin themselves now
  function go(lat, lon, acc) {
    if (!(acc < best)) return;  // only ever move to a better fix
    setPlaced();
    best = acc || 1;
    if (ring) ring.remove();
    ring = acc > 30 ? L.circle([lat, lon], { radius: acc, color: "#2481cc", weight: 1, fillOpacity: .08,
                                             interactive: false }).addTo(map) : null;
    const m = acc >= 1000 ? (acc / 1000).toFixed(1) + " km" : Math.round(acc) + " m";
    $("status").textContent = acc > ROUGH_M ? TEXT.rough.replace("{m}", m) : "";
    map.setView([lat, lon], acc > 1000 ? 15 : acc > ROUGH_M ? 17 : 18);
  }
  $("locate").addEventListener("click", () => {
    $("status").textContent = TEXT.finding;
    stopWatch(); best = Infinity;
    const fail = () => { if (best === Infinity) $("status").textContent = TEXT.noloc; };
    const browser = () => {  // the phone's location through the page itself
      if (!navigator.geolocation) return fail();
      stopWatch();
      watch = navigator.geolocation.watchPosition(p => {
        go(p.coords.latitude, p.coords.longitude, p.coords.accuracy || 0);
        if (best <= 30) stopWatch();
      }, () => { fail(); stopWatch(); }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
      setTimeout(stopWatch, 20000);
    };
    const lm = tg && tg.LocationManager;
    if (inTelegram && lm && tg.isVersionAtLeast && tg.isVersionAtLeast("8.0")) {
      // Telegram's location (asks the user the first time). If it doesn't answer, the page asks the phone instead.
      let answered = false;
      const quiet = setTimeout(() => { if (!answered) browser(); }, 8000);
      const ask = () => lm.getLocation(l => {
        answered = true; clearTimeout(quiet);
        l ? go(l.latitude, l.longitude, l.horizontal_accuracy || 0) : fail();
      });
      withLocationManager(lm, () => {
        if (!lm.isLocationAvailable) { clearTimeout(quiet); return browser(); }
        ask();
        setTimeout(() => { if (best > ROUGH_M) ask(); }, 4000);  // a GPS fix often comes a moment later
      });
    } else browser();
  });
  // Start where the phone is. For a pickup, ask for the location (it's usually where you are now); for anything
  // else, only if the phone already lets this page have it, so no permission question pops up.
  if (!P.get("lat")) {
    const lm = inTelegram && tg.LocationManager;
    if (mode === "pickup") $("locate").click();
    else if (lm && tg.isVersionAtLeast && tg.isVersionAtLeast("8.0")) {
      withLocationManager(lm, () => { if (lm.isLocationAvailable && lm.isAccessGranted) $("locate").click(); });
    } else if (navigator.permissions && navigator.geolocation) {
      navigator.permissions.query({ name: "geolocation" })
        .then(p => { if (p.state === "granted") $("locate").click(); }).catch(() => {});
    }
  }

  async function send() {
    if (!placed) return;
    await naming;  // don't send a spot with the previous spot's name
    const c = map.getCenter();
    const pick = { lat: +c.lat.toFixed(6), lon: +c.lng.toFixed(6), label: label.slice(0, 80) };
    if (chosen && chosen.names && metres(c, chosen) < 30) pick.names = chosen.names;
    const data = JSON.stringify({ v: 1, pick });
    if (BACK && tg && tg.initData) return post(pick);   // opened from a button inside the chat
    if (inTelegram) tg.sendData(data);           // back to the bot; the map closes
    else $("status").textContent = TEXT.preview + " " + data;
  }
  // Opened from a button inside the chat (not the bottom menu), Telegram can't take the spot back to the chat
  // itself, so it goes to the bot's server, signed with Telegram's initData; the bot then carries on the chat.
  const BACK = P.get("back");
  async function post(pick) {
    tg.MainButton.showProgress && tg.MainButton.showProgress();
    try {
      const r = await fetch(BACK, { method: "POST", headers: { "Content-Type": "text/plain" },
                                    body: JSON.stringify({ init: tg.initData, pick }) });
      if (r.ok) return tg.close();
    } catch (e) {}
    tg.MainButton.hideProgress && tg.MainButton.hideProgress();
    $("status").textContent = TEXT.failed;
  }
  if (inTelegram) {
    tg.MainButton.setText(TEXT.confirm);
    if (placed) tg.MainButton.show();
    tg.MainButton.onClick(send);
  } else {
    if (placed) $("confirm").style.display = "block";
    $("confirm").addEventListener("click", send);
  }
})();
</script>
</body>
</html>
